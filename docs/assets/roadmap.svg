<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 32 1280 196" width="1280" height="196" role="img" aria-labelledby="t d">
  <title id="t">Roadmap</title>
  <desc id="d">Five stages: Data (done), Training infrastructure (in progress), Research (next), Improvements (planned), Scale and ship (planned).</desc>
  <rect y="32" width="1280" height="196" rx="18" fill="#111a15"/>

  <!-- track -->
  <line x1="128" y1="100" x2="1152" y2="100" stroke="#2b3d33" stroke-width="4" stroke-linecap="round"/>
  <line x1="128" y1="100" x2="384" y2="100" stroke="#3fb68b" stroke-width="4" stroke-linecap="round"/>

  <!-- 1 done -->
  <circle cx="128" cy="100" r="22" fill="#3fb68b"/>
  <path d="M117 100 L125 108 L140 92" stroke="#111a15" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 2 in progress -->
  <circle cx="384" cy="100" r="22" fill="#111a15" stroke="#3fb68b" stroke-width="4"/>
  <path d="M384 86 A14 14 0 0 1 384 114 Z" fill="#3fb68b"/>
  <!-- 3 next -->
  <circle cx="640" cy="100" r="22" fill="#111a15" stroke="#e0a43a" stroke-width="4"/>
  <circle cx="640" cy="100" r="6" fill="#e0a43a"/>
  <!-- 4, 5 planned -->
  <circle cx="896" cy="100" r="22" fill="#111a15" stroke="#4a5f53" stroke-width="4"/>
  <circle cx="1152" cy="100" r="22" fill="#111a15" stroke="#4a5f53" stroke-width="4"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g font-size="20" font-weight="600" fill="#e7ece8">
      <text x="128" y="160">Data</text>
      <text x="384" y="160">Training infrastructure</text>
      <text x="640" y="160">Research</text>
      <text x="896" y="160">Improvements</text>
      <text x="1152" y="160">Scale &amp; ship</text>
    </g>
    <g font-size="15">
      <text x="128" y="188" fill="#7fd1ad">done</text>
      <text x="384" y="188" fill="#7fd1ad">in progress</text>
      <text x="640" y="188" fill="#f0c372">next</text>
      <text x="896" y="188" fill="#8a9c91">planned</text>
      <text x="1152" y="188" fill="#8a9c91">planned</text>
    </g>
  </g>
</svg>
