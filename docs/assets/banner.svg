<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">fungai</title>
  <desc id="d">Banner: the word fungai beside illustrated mushrooms, one inside a detection frame.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1813"/>
      <stop offset="1" stop-color="#1c2c22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#3fb68b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3fb68b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9553b"/>
      <stop offset="1" stop-color="#a8331f"/>
    </linearGradient>
    <linearGradient id="capBrown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c5a35"/>
      <stop offset="1" stop-color="#5f3a1f"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#glow)"/>

  <!-- floating spores -->
  <g fill="#cfe9dc" opacity="0.35">
    <circle cx="760" cy="70" r="2"/><circle cx="812" cy="118" r="1.5"/><circle cx="905" cy="58" r="2.2"/>
    <circle cx="1188" cy="92" r="1.6"/><circle cx="1230" cy="160" r="2"/><circle cx="1050" cy="46" r="1.4"/>
    <circle cx="700" cy="150" r="1.4"/><circle cx="1150" cy="140" r="1.2"/><circle cx="960" cy="110" r="1.3"/>
  </g>

  <!-- title block -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="150" font-size="96" font-weight="800" fill="#f3efe6" letter-spacing="-2">fungai</text>
    <text x="76" y="198" font-size="26" fill="#c9d6cd">Mushroom identification that knows when it isn't sure.</text>
    <g font-size="17" font-weight="600">
      <rect x="76" y="232" width="92" height="34" rx="17" fill="#24392d" stroke="#3fb68b" stroke-opacity="0.5"/>
      <text x="122" y="254" text-anchor="middle" fill="#bfe8d4">image</text>
      <rect x="180" y="232" width="104" height="34" rx="17" fill="#24392d" stroke="#3fb68b" stroke-opacity="0.5"/>
      <text x="232" y="254" text-anchor="middle" fill="#bfe8d4">context</text>
      <rect x="296" y="232" width="148" height="34" rx="17" fill="#24392d" stroke="#3fb68b" stroke-opacity="0.5"/>
      <text x="370" y="254" text-anchor="middle" fill="#bfe8d4">uncertainty</text>
      <rect x="456" y="232" width="176" height="34" rx="17" fill="#3a2420" stroke="#e66767" stroke-opacity="0.6"/>
      <text x="544" y="254" text-anchor="middle" fill="#f5c4bd">toxic look-alikes</text>
    </g>
  </g>

  <!-- ground -->
  <path d="M520 360 C620 352 690 318 760 324 T880 320 T1000 326 T1120 318 T1280 324 L1280 342 Q1280 360 1262 360 L520 360 Z" fill="#132019"/>
  <g fill="#2b4a36">
    <ellipse cx="840" cy="326" rx="26" ry="7"/><ellipse cx="1060" cy="328" rx="34" ry="8"/><ellipse cx="1210" cy="324" rx="22" ry="6"/>
  </g>

  <!-- mycena (small, slender) -->
  <path d="M877 324 Q879 286 881 256 L885 256 Q885 290 888 324 Z" fill="#d9cdb8"/>
  <path d="M864 258 Q882 214 902 258 Q883 262 864 258 Z" fill="#a99a86"/>
  <path d="M868 257 L883 222 M876 258 L883 222 M890 258 L883 222 M897 257 L883 222" stroke="#8a7c69" stroke-width="1" fill="none" opacity="0.6"/>

  <!-- amanita (fly agaric) -->
  <path d="M986 324 Q984 280 990 236 Q1002 230 1012 236 Q1018 280 1016 324 Z" fill="#efe6d2"/>
  <ellipse cx="1001" cy="262" rx="18" ry="5.5" fill="#ddd0b4"/>
  <ellipse cx="1001" cy="324" rx="24" ry="7" fill="#e6dcc6"/>
  <path d="M918 238 Q922 150 1001 145 Q1080 150 1084 238 Q1001 254 918 238 Z" fill="url(#capRed)"/>
  <g fill="#f6eee0">
    <circle cx="960" cy="196" r="7"/><circle cx="992" cy="170" r="6"/><circle cx="1030" cy="182" r="8"/>
    <circle cx="1056" cy="214" r="5.5"/><circle cx="944" cy="226" r="5"/><circle cx="1004" cy="214" r="6.5"/>
    <circle cx="1022" cy="156" r="4"/>
  </g>

  <!-- bolete -->
  <path d="M1112 324 Q1104 286 1116 258 L1146 258 Q1158 286 1150 324 Z" fill="#e6d5b0"/>
  <path d="M1116 270 Q1131 274 1146 270 M1114 288 Q1131 292 1150 288 M1113 306 Q1131 310 1151 306" stroke="#cdb98f" stroke-width="1.4" fill="none"/>
  <path d="M1078 264 Q1082 194 1131 190 Q1180 194 1184 264 Q1131 274 1078 264 Z" fill="url(#capBrown)"/>
  <path d="M1096 214 Q1118 200 1140 204" stroke="#a87650" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- detection frame around the amanita -->
  <g stroke="#3fb68b" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M900 152 V128 H924"/><path d="M1078 128 H1102 V152"/>
    <path d="M900 316 V340 H924"/><path d="M1078 340 H1102 V316"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="900" y="94" width="202" height="26" rx="6" fill="#3fb68b"/>
    <text x="912" y="112" fill="#0e1813">Amanita muscaria · ⚠ toxic</text>
  </g>
</svg>
